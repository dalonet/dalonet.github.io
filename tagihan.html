<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membuka Pembayaran DALONET</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      color: #333;
    }
    button {
      background: #c9152b;
      color: white;
      border: 0;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 15px;
    }
    a { color: #c9152b; }
  </style>
</head>
<body>

  <h3>Membuka Pembayaran DALONET...</h3>
  <p id="status">Mencoba membuka Google Chrome.</p>

  <button id="open" style="display:none"
    onclick="openChrome()">
    Buka di Google Chrome
  </button>

  <p id="fallback" style="display:none">
    Jika tidak berhasil, buka
    <a href="https://dalonet.github.io/bayar">
      halaman pembayaran DALONET
    </a>
  </p>

  <script>
    const url = "https://dalonet.github.io/bayar";

    function openChrome() {
      window.location.href =
        "intent://dalonet.github.io/bayar#Intent;" +
        "scheme=https;" +
        "package=com.android.chrome;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(url) +
        ";end";
    }

    const ua = navigator.userAgent;

    if (/Android/i.test(ua)) {

      openChrome();

      setTimeout(() => {
        if (!document.hidden) {
          document.getElementById("status").innerText =
            "Browser tidak berhasil dibuka otomatis.";

          document.getElementById("open").style.display =
            "inline-block";

          document.getElementById("fallback").style.display =
            "block";
        }
      }, 2500);

    } else if (/iPhone|iPad|iPod/i.test(ua)) {

      document.getElementById("status").innerText =
        "Membuka halaman pembayaran.";

      window.location.href = url;

    } else {

      window.location.href = url;

    }
  </script>

</body>
</html>
